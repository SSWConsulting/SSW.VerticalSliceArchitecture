name: Package
on:
  push:
    branches:
      - main
    paths:
      - 'VerticalSliceArchitecture.nuspec'
  workflow_dispatch:
jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the job request a GitHub OIDC token, which NuGet.org exchanges for a publish key.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: nuget/setup-nuget@v4
        with:
          nuget-version: '6.x'

      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y mono-complete

      - name: Create the package
        run: nuget pack VerticalSliceArchitecture.nuspec -NoDefaultExcludes
        
      # Reads the SDK version from global.json, which the dotnet CLI needs to run in this repo.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      # Trusted Publishing: NuGet.org checks the OIDC token against the policy registered for this
      # repository and workflow file, then issues a key that lasts one hour. Keep this step
      # directly before the push so the key cannot expire first. NUGET_USER is the nuget.org
      # profile name of the policy's creator, not an email address.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushed with the dotnet CLI rather than nuget.exe: under Mono, nuget.exe validates TLS
      # against Mono's own certificate store, which rejects api.nuget.org on current runners.
      - name: Publish the package
        run: dotnet nuget push *.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Get version
        id: package_version
        uses: KageKirin/get-csproj-version@v1.0.0
        with:
          file: VerticalSliceArchitecture.nuspec
          xpath: //*[local-name()='version']

      - name: Create git tag
        run: |
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git tag -m "CI: create new tag" ${{ steps.package_version.outputs.version }}
            git push https://${{ github.token }}@github.com/SSWConsulting/VerticalSliceArchitecture

      - name: Create release
        uses: ncipollo/release-action@v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          generateReleaseNotes: true
          tag: ${{ steps.package_version.outputs.version }}